<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Academic Assistant</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom Modern Chatbot CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="bg-body-tertiary">

  <div class="container py-3 py-md-4 h-100 d-flex flex-column justify-content-center">
    <div class="row justify-content-center h-100">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7 d-flex flex-column h-100">

        <!-- Main Chatbot Card -->
        <div class="card chat-card border shadow-sm rounded-4 flex-grow-1 d-flex flex-column overflow-hidden">
          
          <!-- Modern Minimal Header (No WhatsApp styling) -->
          <div class="chat-header bg-white border-bottom px-4 py-3 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2.5">
              <div class="bot-icon-circle bg-light text-primary border d-flex align-items-center justify-content-center rounded-circle">
                <i class="bi bi-robot fs-5 text-primary"></i>
              </div>
              <div>
                <h1 class="h6 mb-0 fw-semibold text-dark">Student Academic Assistant</h1>
                <small class="text-muted d-flex align-items-center gap-1">
                  <span class="status-dot"></span>
                  <span id="botStatus">Online</span>
                </small>
              </div>
            </div>

            <div class="d-flex align-items-center gap-2">
              <span id="studentPill" class="badge bg-light text-dark border px-2.5 py-1.5 rounded-pill fw-medium d-none">
                <i class="bi bi-person-check-fill text-success me-1"></i><span id="studentPillId"></span>
              </span>
              <button id="resetSessionBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-2.5 py-1 text-xs d-none" title="Reset Session">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
              </button>
            </div>
          </div>

          <!-- Chat Conversation Area (Initially completely empty as requested) -->
          <div class="chat-body flex-grow-1 p-3 p-md-4 overflow-y-auto" id="conversationContainer">
            <div id="messagesList" class="d-flex flex-column gap-3">
              <!-- No welcome message on initial load. Pure empty state. -->
            </div>

            <!-- Dynamic Interactive Menu Buttons (Shown ONLY after verification) -->
            <div id="menuButtonsArea" class="mt-3 d-none">
              <div class="card bg-light border p-2.5 rounded-3">
                <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                  <span class="text-xs fw-bold text-uppercase text-secondary tracking-wide">
                    <i class="bi bi-grid-fill me-1"></i>Available Options
                  </span>
                  <span class="text-xs text-muted">Click or type an option</span>
                </div>
                <div class="row g-2">
                  <div class="col-6 col-sm-4">
                    <button class="btn btn-white w-100 text-start menu-btn border shadow-2xs" data-command="1" data-label="My Profile">
                      <i class="bi bi-person-circle text-primary me-1.5"></i>1. My Profile
                    </button>
                  </div>
                  <div class="col-6 col-sm-4">
                    <button class="btn btn-white w-100 text-start menu-btn border shadow-2xs" data-command="2" data-label="Attendance Report">
                      <i class="bi bi-calendar-check text-primary me-1.5"></i>2. Attendance Report
                    </button>
                  </div>
                  <div class="col-6 col-sm-4">
                    <button class="btn btn-white w-100 text-start menu-btn border shadow-2xs" data-command="3" data-label="Internal Marks">
                      <i class="bi bi-journal-text text-primary me-1.5"></i>3. Internal Marks
                    </button>
                  </div>
                  <div class="col-6 col-sm-4">
                    <button class="btn btn-white w-100 text-start menu-btn border shadow-2xs" data-command="4" data-label="Academic Performance">
                      <i class="bi bi-graph-up-arrow text-primary me-1.5"></i>4. Academic Performance
                    </button>
                  </div>
                  <div class="col-6 col-sm-4">
                    <button class="btn btn-white w-100 text-start menu-btn border shadow-2xs" data-command="5" data-label="Study Recommendations">
                      <i class="bi bi-lightbulb text-primary me-1.5"></i>5. Study Recommendations
                    </button>
                  </div>
                  <div class="col-6 col-sm-4">
                    <button class="btn btn-white w-100 text-start menu-btn border shadow-2xs text-danger" data-command="6" data-label="Logout">
                      <i class="bi bi-box-arrow-right text-danger me-1.5"></i>6. Logout
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Typing indicator -->
            <div id="typingIndicator" class="typing-indicator d-none mt-2">
              <div class="chat-bubble bot-bubble d-inline-flex align-items-center gap-2 py-2 px-3">
                <span class="spinner-grow spinner-grow-sm text-secondary" role="status" aria-hidden="true"></span>
                <span class="text-muted text-xs">Assistant is typing...</span>
              </div>
            </div>

            <div id="chatBottomAnchor"></div>
          </div>

          <!-- Bottom Text Input Area (Text input only, no voice/microphone) -->
          <div class="chat-footer bg-white border-top p-3">
            <form id="chatForm" class="d-flex align-items-center gap-2 m-0" autocomplete="off">
              <input 
                type="text" 
                id="messageInput" 
                class="form-control rounded-pill px-3.5 py-2 border shadow-xs text-sm" 
                placeholder="Type a message (e.g., 'Hi' or 'Hello')..." 
                required 
                autofocus
              />
              <button type="submit" id="sendBtn" class="btn btn-primary rounded-pill px-3.5 py-2 text-white fw-medium d-flex align-items-center gap-1.5 text-sm shadow-sm">
                <span>Send</span>
                <i class="bi bi-send-fill text-xs"></i>
              </button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Chatbot JavaScript -->
  <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
